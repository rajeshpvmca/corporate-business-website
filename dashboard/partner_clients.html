<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Client Roster</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        body { background-color: transparent; color: var(--text-dark); padding: 1.5rem; min-height: 100vh; }
        .dash-card { background: var(--white); border: 1px solid rgba(0, 0, 0, 0.05); border-radius: 16px; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03); }
        .header-icon { width: 45px; height: 45px; background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: white; box-shadow: 0 5px 15px rgba(139, 92, 246, 0.3); }
        .table-custom th { color: #71717a; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid rgba(0,0,0,0.05); padding-bottom: 1rem; }
        .table-custom td { padding: 1.2rem 0.5rem; border-bottom: 1px solid rgba(0,0,0,0.05); color: var(--text-dark); vertical-align: middle; }
        .apexcharts-tooltip { background: #fff !important; border: 1px solid rgba(0,0,0,0.1) !important; color: #333 !important; }
        .apexcharts-tooltip-title { background: #f8f9fa !important; border-bottom: 1px solid rgba(0,0,0,0.1) !important; }
    </style>
</head>
<body>
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 fade-in gap-3">
        <div class="d-flex align-items-center">
            <div class="header-icon me-3">
                <span class="material-symbols-outlined">groups</span>
            </div>
            <div>
                <h3 class="fw-bold mb-0 text-dark" style="font-size: clamp(1.2rem, 4vw, 1.5rem);">Client Roster</h3>
                <p class="text-muted small fw-bold text-uppercase letter-spacing-1 mb-0">Managed Accounts</p>
            </div>
        </div>
        <div class="d-flex gap-2">
            <input type="text" class="form-control rounded-pill bg-light border-0 shadow-none px-4" placeholder="Search clients...">
        </div>
    </div>

    <div class="row g-4 fade-in mb-4">
        <div class="col-12 col-lg-4">
            <div class="dash-card p-4 h-100">
                <h6 class="fw-bold text-dark mb-4 text-center">Industry Distribution</h6>
                <div id="industryChart" class="d-flex justify-content-center"></div>
            </div>
        </div>
        
        <div class="col-12 col-lg-8">
            <div class="dash-card p-4 h-100">
                <div class="table-responsive">
                    <table class="table table-borderless table-custom align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Client Name</th>
                                <th>Industry</th>
                                <th>MRR</th>
                                <th>Health</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>
                                    <div class="d-flex align-items-center gap-3">
                                        <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center" style="width: 35px; height: 35px; font-weight: bold;">NC</div>
                                        <div class="fw-bold">Nexus Corp</div>
                                    </div>
                                </td>
                                <td><span class="badge bg-light text-dark border">Tech</span></td>
                                <td class="fw-bold">&#36;12,500</td>
                                <td><span class="badge bg-success bg-opacity-10 text-success rounded-pill px-3">Healthy</span></td>
                                <td><button onclick="window.top.location.href='../404.html'; return false;" class="btn btn-sm btn-outline-dark rounded-pill px-3">Manage</button></td>
                            </tr>
                            <tr>
                                <td>
                                    <div class="d-flex align-items-center gap-3">
                                        <div class="rounded-circle bg-secondary text-white d-flex align-items-center justify-content-center" style="width: 35px; height: 35px; font-weight: bold;">OF</div>
                                        <div class="fw-bold">Omni Financial</div>
                                    </div>
                                </td>
                                <td><span class="badge bg-light text-dark border">Finance</span></td>
                                <td class="fw-bold">&#36;24,000</td>
                                <td><span class="badge bg-success bg-opacity-10 text-success rounded-pill px-3">Healthy</span></td>
                                <td><button onclick="window.top.location.href='../404.html'; return false;" class="btn btn-sm btn-outline-dark rounded-pill px-3">Manage</button></td>
                            </tr>
                            <tr>
                                <td>
                                    <div class="d-flex align-items-center gap-3">
                                        <div class="rounded-circle bg-warning text-dark d-flex align-items-center justify-content-center" style="width: 35px; height: 35px; font-weight: bold;">AH</div>
                                        <div class="fw-bold">Apex Healthcare</div>
                                    </div>
                                </td>
                                <td><span class="badge bg-light text-dark border">Healthcare</span></td>
                                <td class="fw-bold">&#36;8,200</td>
                                <td><span class="badge bg-danger bg-opacity-10 text-danger rounded-pill px-3">At Risk</span></td>
                                <td><button onclick="window.top.location.href='../404.html'; return false;" class="btn btn-sm btn-outline-dark rounded-pill px-3">Manage</button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const els = document.querySelectorAll('.fade-in');
            els.forEach((el, index) => { el.style.opacity = '0'; el.style.transform = 'translateY(15px)'; el.style.transition = 'all 0.5s ease ' + (index * 0.1) + 's'; setTimeout(() => { el.style.opacity = '1'; el.style.transform = 'translateY(0)'; }, 50); });

            var industryOptions = {
                series: [45, 30, 25],
                chart: { height: 280, type: 'donut', fontFamily: 'Inter, sans-serif' },
                labels: ['Technology', 'Finance', 'Healthcare'],
                colors: ['#8b5cf6', '#f43f5e', '#fbbf24'],
                stroke: { show: false },
                dataLabels: { enabled: false },
                legend: { position: 'bottom', labels: { colors: '#333' } },
                plotOptions: { pie: { donut: { size: '70%', labels: { show: true, value: { color: '#333', fontSize: '1.2rem', fontWeight: 'bold' } } } } }
            };
            var industryChart = new ApexCharts(document.querySelector("#industryChart"), industryOptions);
            industryChart.render();
        });
    </script>
</body>
</html>
