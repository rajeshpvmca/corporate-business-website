<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Invoices & Billing</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        body { background-color: transparent; color: var(--text-dark); padding: 1.5rem; min-height: 100vh; }
        .dash-card { background: var(--white); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(0, 0, 0, 0.05); border-radius: 16px; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03); transition: all 0.3s ease; }
        .dash-card:hover { border-color: rgba(139, 92, 246, 0.5); }
        .header-icon { width: 45px; height: 45px; background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: white; box-shadow: 0 5px 15px rgba(139, 92, 246, 0.3); }
        .table-custom th { color: #71717a; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid rgba(0,0,0,0.05); padding-bottom: 1rem; }
        .table-custom td { padding: 1.2rem 0.5rem; border-bottom: 1px solid rgba(0,0,0,0.05); color: var(--text-dark); vertical-align: middle; }
        .badge-pill { padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
        .apexcharts-tooltip { background: #fff !important; border: 1px solid rgba(0,0,0,0.1) !important; color: #333 !important; }
        .apexcharts-tooltip-title { background: #f8f9fa !important; border-bottom: 1px solid rgba(0,0,0,0.1) !important; }
    </style>
</head>
<body>
    <div class="d-flex align-items-center mb-4 fade-in">
        <div class="header-icon me-3">
            <span class="material-symbols-outlined">receipt_long</span>
        </div>
        <div>
            <h3 class="fw-bold mb-0 text-dark" style="font-size: clamp(1.2rem, 4vw, 1.5rem);">Invoices & Billing</h3>
            <p class="text-muted small fw-bold text-uppercase letter-spacing-1 mb-0">Financial Hub</p>
        </div>
    </div>

    <div class="row g-4 fade-in mb-4">
        <div class="col-12 col-md-4">
            <div class="dash-card p-4 h-100" style="background: linear-gradient(135deg, rgba(244,63,94,0.1), rgba(9,9,11,0.1)); border-color: rgba(244,63,94,0.3);">
                <span class="text-dark small fw-bold text-uppercase mb-2 d-block">Outstanding Balance</span>
                <h2 class="fw-bold text-dark mb-3">$14,500.00</h2>
                <button onclick="window.top.location.href='../404.html'; return false;" class="btn btn-sm text-white fw-bold rounded-pill px-4" style="background: var(--secondary-color);">Pay Now</button>
            </div>
        </div>
        <div class="col-12 col-md-8">
            <div class="dash-card p-4 h-100">
                <h6 class="fw-bold text-dark mb-3">Billing History (YTD)</h6>
                <div id="barChart" style="margin-top: -10px;"></div>
            </div>
        </div>
    </div>

    <div class="col-12 fade-in">
        <div class="dash-card p-4">
            <h5 class="fw-bold text-dark mb-4">Recent Invoices</h5>
            <div class="table-responsive">
                <table class="table  table-borderless table-custom align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Invoice ID</th>
                            <th>Date Issued</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th class="text-end">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="fw-bold">INV-2026-0801</td>
                            <td>Aug 01, 2026</td>
                            <td class="fw-bold">$14,500.00</td>
                            <td><span class="badge-pill bg-warning text-dark">Pending</span></td>
                            <td class="text-end">
                                <button onclick="window.top.location.href='../404.html'; return false;" class="btn btn-sm btn-outline-dark rounded-pill px-3"><i class="fas fa-download me-1"></i> PDF</button>
                            </td>
                        </tr>
                        <tr>
                            <td class="fw-bold">INV-2026-0701</td>
                            <td>Jul 01, 2026</td>
                            <td class="fw-bold">,000.00</td>
                            <td><span class="badge-pill bg-success text-white">Paid</span></td>
                            <td class="text-end">
                                <button onclick="window.top.location.href='../404.html'; return false;" class="btn btn-sm btn-outline-dark rounded-pill px-3"><i class="fas fa-download me-1"></i> PDF</button>
                            </td>
                        </tr>
                        <tr>
                            <td class="fw-bold">INV-2026-0601</td>
                            <td>Jun 01, 2026</td>
                            <td class="fw-bold">,000.00</td>
                            <td><span class="badge-pill bg-success text-white">Paid</span></td>
                            <td class="text-end">
                                <button onclick="window.top.location.href='../404.html'; return false;" class="btn btn-sm btn-outline-dark rounded-pill px-3"><i class="fas fa-download me-1"></i> PDF</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const els = document.querySelectorAll('.fade-in');
            els.forEach((el, index) => {
                el.style.opacity = '0'; el.style.transform = 'translateY(15px)';
                el.style.transition = 'all 0.5s ease ' + (index * 0.1) + 's';
                setTimeout(() => { el.style.opacity = '1'; el.style.transform = 'translateY(0)'; }, 50);
            });

            var barOptions = {
                series: [{ name: 'Billed Amount', data: [15, 22, 22, 18, 14.5] }],
                chart: { height: 200, type: 'bar', toolbar: { show: false }, fontFamily: 'Inter, sans-serif' },
                colors: ['#8b5cf6'],
                plotOptions: { bar: { borderRadius: 4, columnWidth: '40%' } },
                dataLabels: { enabled: false },
                xaxis: { categories: ['Apr', 'May', 'Jun', 'Jul', 'Aug'], labels: { style: { colors: '#71717a' } }, axisBorder: { show: false }, axisTicks: { show: false } },
                yaxis: { labels: { style: { colors: '#71717a' }, formatter: (value) => { return "$" + value + "k" } } },
                grid: { borderColor: 'rgba(0,0,0,0.05)', strokeDashArray: 4 }
            };
            var barChart = new ApexCharts(document.querySelector("#barChart"), barOptions);
            barChart.render();
        });
    </script>
</body>
</html>
