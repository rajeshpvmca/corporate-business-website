<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Marketing Resources</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <style>
        body { background-color: transparent; color: var(--text-dark); padding: 1.5rem; min-height: 100vh; }
        .dash-card { background: var(--white); border: 1px solid rgba(0, 0, 0, 0.05); border-radius: 16px; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03); transition: transform 0.3s ease; }
        .dash-card:hover { transform: translateY(-5px); border-color: rgba(139, 92, 246, 0.3); box-shadow: 0 10px 25px rgba(139, 92, 246, 0.1); }
        .header-icon { width: 45px; height: 45px; background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: white; box-shadow: 0 5px 15px rgba(139, 92, 246, 0.3); }
        .resource-icon { width: 60px; height: 60px; background: rgba(0,0,0,0.03); border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: var(--primary-color); margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="d-flex align-items-center mb-4 fade-in">
        <div class="header-icon me-3">
            <span class="material-symbols-outlined">cloud_download</span>
        </div>
        <div>
            <h3 class="fw-bold mb-0 text-dark" style="font-size: clamp(1.2rem, 4vw, 1.5rem);">Marketing Resources</h3>
            <p class="text-muted small fw-bold text-uppercase letter-spacing-1 mb-0">Partner Enablement</p>
        </div>
    </div>

    <div class="row g-4 fade-in">
        <div class="col-12 col-md-6 col-lg-4">
            <div class="dash-card p-4 text-center h-100">
                <div class="d-flex justify-content-center"><div class="resource-icon"><i class="fas fa-file-pdf"></i></div></div>
                <h6 class="fw-bold text-dark mb-1">Corporate Pitch Deck</h6>
                <p class="text-muted small mb-3">Updated Q3 2026 &bull; 4.2 MB</p>
                <button class="btn btn-outline-dark btn-sm rounded-pill px-4 fw-bold w-100"><i class="fas fa-download me-2"></i> Download</button>
            </div>
        </div>
        <div class="col-12 col-md-6 col-lg-4">
            <div class="dash-card p-4 text-center h-100">
                <div class="d-flex justify-content-center"><div class="resource-icon text-secondary"><i class="fas fa-image"></i></div></div>
                <h6 class="fw-bold text-dark mb-1">Brand Assets & Logos</h6>
                <p class="text-muted small mb-3">Vector SVG/PNG &bull; 12.5 MB</p>
                <button class="btn btn-outline-dark btn-sm rounded-pill px-4 fw-bold w-100"><i class="fas fa-download me-2"></i> Download</button>
            </div>
        </div>
        <div class="col-12 col-md-6 col-lg-4">
            <div class="dash-card p-4 text-center h-100">
                <div class="d-flex justify-content-center"><div class="resource-icon text-success"><i class="fas fa-chart-line"></i></div></div>
                <h6 class="fw-bold text-dark mb-1">Enterprise Case Studies</h6>
                <p class="text-muted small mb-3">5 Success Stories &bull; 8.1 MB</p>
                <button class="btn btn-outline-dark btn-sm rounded-pill px-4 fw-bold w-100"><i class="fas fa-download me-2"></i> Download</button>
            </div>
        </div>
        <div class="col-12 col-md-6 col-lg-4">
            <div class="dash-card p-4 text-center h-100">
                <div class="d-flex justify-content-center"><div class="resource-icon text-info"><i class="fas fa-file-alt"></i></div></div>
                <h6 class="fw-bold text-dark mb-1">Sales Battlecards</h6>
                <p class="text-muted small mb-3">Competitive Analysis &bull; 2.4 MB</p>
                <button class="btn btn-outline-dark btn-sm rounded-pill px-4 fw-bold w-100"><i class="fas fa-download me-2"></i> Download</button>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const els = document.querySelectorAll('.fade-in');
            els.forEach((el, index) => { el.style.opacity = '0'; el.style.transform = 'translateY(15px)'; el.style.transition = 'all 0.5s ease ' + (index * 0.1) + 's'; setTimeout(() => { el.style.opacity = '1'; el.style.transform = 'translateY(0)'; }, 50); });
        });
    </script>
</body>
</html>
