<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Client Projects</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        body {
            background-color: transparent;
            color: var(--text-dark);
            padding: 1.5rem;
            min-height: 100vh;
        }
        .dash-card {
            background: var(--white);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 16px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .dash-card:hover { border-color: rgba(139, 92, 246, 0.5); }
        .header-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
            box-shadow: 0 5px 15px rgba(139, 92, 246, 0.3);
        }
        .progress-custom {
            height: 8px;
            background: rgba(0,0,0,0.05);
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar-custom {
            height: 100%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: 10px;
        }
        .badge-status {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .apexcharts-tooltip { background: #fff !important; border: 1px solid rgba(0,0,0,0.1) !important; color: #333 !important; }
        .apexcharts-tooltip-title { background: #f8f9fa !important; border-bottom: 1px solid rgba(0,0,0,0.1) !important; }
    </style>
</head>
<body>
    <div class="d-flex align-items-center mb-4 fade-in">
        <div class="header-icon me-3">
            <span class="material-symbols-outlined">account_tree</span>
        </div>
        <div>
            <h3 class="fw-bold mb-0 text-dark" style="font-size: clamp(1.2rem, 4vw, 1.5rem);">My Active Projects</h3>
            <p class="text-muted small fw-bold text-uppercase letter-spacing-1 mb-0">Deployment Status</p>
        </div>
    </div>

    <div class="row g-4 fade-in mb-4">
        <div class="col-12 col-lg-8">
            <div class="row g-4">
                <!-- Project 1 -->
                <div class="col-12">
                    <div class="dash-card p-4">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <div>
                                <h5 class="fw-bold text-dark mb-1">Global Cloud Migration</h5>
                                <p class="text-muted small mb-0">Phase 2: Database shard distribution</p>
                            </div>
                            <span class="badge-status" style="background: rgba(139, 92, 246, 0.15); color: var(--primary-color); border: 1px solid var(--primary-color);">In Progress</span>
                        </div>
                        <div class="d-flex justify-content-between text-muted small fw-bold mb-2">
                            <span>Progress</span>
                            <span class="text-dark">65%</span>
                        </div>
                        <div class="progress-custom mb-3">
                            <div class="progress-bar-custom" style="width: 65%;"></div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="d-flex gap-2">
                                <div class="rounded-circle bg-secondary text-white d-flex align-items-center justify-content-center" style="width: 30px; height: 30px; font-size: 0.8rem; font-weight: bold;">AK</div>
                                <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center" style="width: 30px; height: 30px; font-size: 0.8rem; font-weight: bold; margin-left: -15px;">MR</div>
                            </div>
                            <button class="btn btn-sm btn-outline-dark rounded-pill px-3 fw-bold">View Details</button>
                        </div>
                    </div>
                </div>
                <!-- Project 2 -->
                <div class="col-12">
                    <div class="dash-card p-4">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <div>
                                <h5 class="fw-bold text-dark mb-1">Zero-Trust Network Security Audit</h5>
                                <p class="text-muted small mb-0">Finalizing endpoint compliance reporting</p>
                            </div>
                            <span class="badge-status" style="background: rgba(244, 63, 94, 0.15); color: var(--secondary-color); border: 1px solid var(--secondary-color);">Review</span>
                        </div>
                        <div class="d-flex justify-content-between text-muted small fw-bold mb-2">
                            <span>Progress</span>
                            <span class="text-dark">90%</span>
                        </div>
                        <div class="progress-custom mb-3">
                            <div class="progress-bar-custom" style="width: 90%; background: var(--secondary-color);"></div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="d-flex gap-2">
                                <div class="rounded-circle bg-info text-white d-flex align-items-center justify-content-center" style="width: 30px; height: 30px; font-size: 0.8rem; font-weight: bold;">JL</div>
                            </div>
                            <button class="btn btn-sm btn-outline-dark rounded-pill px-3 fw-bold">View Details</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="col-12 col-lg-4">
            <div class="dash-card p-4 h-100">
                <h5 class="fw-bold text-dark mb-4">Delivery Timeline</h5>
                <div id="radialChart" class="d-flex justify-content-center"></div>
                <div class="mt-4 text-center">
                    <p class="text-muted small mb-0">Projects on schedule</p>
                    <h3 class="fw-bold text-dark mb-0">100%</h3>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const els = document.querySelectorAll('.fade-in');
            els.forEach((el, index) => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(15px)';
                el.style.transition = 'all 0.5s ease ' + (index * 0.1) + 's';
                setTimeout(() => { el.style.opacity = '1'; el.style.transform = 'translateY(0)'; }, 50);
            });

            var radialOptions = {
                series: [65, 90],
                chart: { height: 280, type: 'radialBar', fontFamily: 'Inter, sans-serif' },
                plotOptions: {
                    radialBar: {
                        hollow: { size: '40%' },
                        track: { background: 'rgba(0,0,0,0.05)', margin: 10 },
                        dataLabels: {
                            name: { fontSize: '14px', color: '#71717a' },
                            value: { fontSize: '20px', color: '#333', fontWeight: 'bold' },
                            total: { show: true, label: 'Average', color: '#71717a', formatter: function () { return "77%" } }
                        }
                    }
                },
                labels: ['Cloud Migration', 'Security Audit'],
                colors: ['#8b5cf6', '#f43f5e'],
                stroke: { lineCap: 'round' }
            };
            var radialChart = new ApexCharts(document.querySelector("#radialChart"), radialOptions);
            radialChart.render();
        });
    </script>
</body>
</html>
