<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Partner Settings</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <style>
        body { background-color: transparent; color: var(--text-dark); padding: 1.5rem; min-height: 100vh; }
        .dash-card { background: var(--white); border: 1px solid rgba(0, 0, 0, 0.05); border-radius: 16px; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03); }
        .header-icon { width: 45px; height: 45px; background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: white; box-shadow: 0 5px 15px rgba(139, 92, 246, 0.3); }
        .form-control-custom { background: rgba(0,0,0,0.02); border: 1px solid rgba(0,0,0,0.1); color: var(--text-dark); border-radius: 8px; padding: 0.75rem 1rem; }
        .form-control-custom:focus { background: rgba(0,0,0,0.05); border-color: var(--primary-color); color: var(--text-dark); box-shadow: none; }
        .form-switch .form-check-input { background-color: rgba(0,0,0,0.1); border-color: transparent; }
        .form-switch .form-check-input:checked { background-color: var(--primary-color); border-color: var(--primary-color); }
    </style>
</head>
<body>
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 fade-in gap-3">
        <div class="d-flex align-items-center">
            <div class="header-icon me-3">
                <span class="material-symbols-outlined">settings</span>
            </div>
            <div>
                <h3 class="fw-bold mb-0 text-dark" style="font-size: clamp(1.2rem, 4vw, 1.5rem);">Partner Settings</h3>
                <p class="text-muted small fw-bold text-uppercase letter-spacing-1 mb-0">Agency Profile</p>
            </div>
        </div>
        <button class="btn btn-outline-dark rounded-pill px-4 fw-bold shadow-sm">Save Profile</button>
    </div>

    <div class="row g-4 fade-in">
        <div class="col-12 col-lg-8">
            <div class="dash-card p-4 p-md-5">
                <h5 class="fw-bold text-dark mb-4">Agency Details</h5>
                <div class="row g-4">
                    <div class="col-12 col-md-6">
                        <label class="form-label small fw-bold text-muted text-uppercase">Agency Name</label>
                        <input type="text" class="form-control form-control-custom" value="TechNova Solutions">
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label small fw-bold text-muted text-uppercase">Partner ID</label>
                        <input type="text" class="form-control form-control-custom" value="PTN-449-01X" readonly>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label small fw-bold text-muted text-uppercase">Payout Account (IBAN)</label>
                        <input type="password" class="form-control form-control-custom" value="1234567890123456">
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label small fw-bold text-muted text-uppercase">Tax Identification</label>
                        <input type="text" class="form-control form-control-custom" value="EU-991203">
                    </div>
                </div>
                
                <hr class="my-5" style="border-color: rgba(0,0,0,0.1);">
                
                <h5 class="fw-bold text-dark mb-4">API Integration</h5>
                <div class="d-flex justify-content-between align-items-center mb-3 p-3 rounded-3" style="background: rgba(0,0,0,0.02); border: 1px solid rgba(0,0,0,0.05);">
                    <div>
                        <h6 class="fw-bold text-dark mb-1">Production API Key</h6>
                        <p class="text-muted small mb-0">pk_live_51Mxxxxxxxxxxxxxxxxxxxx</p>
                    </div>
                    <button class="btn btn-sm btn-outline-dark rounded-pill px-3 fw-bold">Reveal</button>
                </div>
                <button class="btn btn-outline-dark rounded-pill px-4 py-2 fw-bold mt-3">Regenerate Keys</button>
            </div>
        </div>
        
        <div class="col-12 col-lg-4">
            <div class="dash-card p-4 p-md-5">
                <h5 class="fw-bold text-dark mb-4">Partner Alerts</h5>
                <div class="form-check form-switch d-flex justify-content-between align-items-center ps-0 mb-4">
                    <label class="form-check-label text-dark" style="cursor: pointer;">New Client Referrals</label>
                    <input class="form-check-input shadow-none m-0 fs-5" type="checkbox" checked>
                </div>
                <div class="form-check form-switch d-flex justify-content-between align-items-center ps-0 mb-4">
                    <label class="form-check-label text-dark" style="cursor: pointer;">Commission Payouts</label>
                    <input class="form-check-input shadow-none m-0 fs-5" type="checkbox" checked>
                </div>
                <div class="form-check form-switch d-flex justify-content-between align-items-center ps-0 mb-4">
                    <label class="form-check-label text-dark" style="cursor: pointer;">Platform Updates</label>
                    <input class="form-check-input shadow-none m-0 fs-5" type="checkbox">
                </div>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const els = document.querySelectorAll('.fade-in');
            els.forEach((el, index) => { el.style.opacity = '0'; el.style.transform = 'translateY(15px)'; el.style.transition = 'all 0.5s ease ' + (index * 0.1) + 's'; setTimeout(() => { el.style.opacity = '1'; el.style.transform = 'translateY(0)'; }, 50); });
        });
    </script>
</body>
</html>
