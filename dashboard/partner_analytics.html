<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Revenue Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        body { background-color: transparent; color: var(--text-dark); padding: 1.5rem; min-height: 100vh; }
        .dash-card { background: var(--white); border: 1px solid rgba(0, 0, 0, 0.05); border-radius: 16px; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03); }
        .header-icon { width: 45px; height: 45px; background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: white; box-shadow: 0 5px 15px rgba(139, 92, 246, 0.3); }
        .apexcharts-tooltip { background: #fff !important; border: 1px solid rgba(0,0,0,0.1) !important; color: #333 !important; }
        .apexcharts-tooltip-title { background: #f8f9fa !important; border-bottom: 1px solid rgba(0,0,0,0.1) !important; }
    </style>
</head>
<body>
    <div class="d-flex align-items-center mb-4 fade-in">
        <div class="header-icon me-3">
            <span class="material-symbols-outlined">monitoring</span>
        </div>
        <div>
            <h3 class="fw-bold mb-0 text-dark" style="font-size: clamp(1.2rem, 4vw, 1.5rem);">Revenue Analytics</h3>
            <p class="text-muted small fw-bold text-uppercase letter-spacing-1 mb-0">Commission Tracking</p>
        </div>
    </div>

    <div class="row g-4 fade-in mb-4">
        <div class="col-12 col-md-4">
            <div class="dash-card p-4 h-100" style="background: linear-gradient(135deg, rgba(139,92,246,0.05), rgba(244,63,94,0.05)); border: none;">
                <span class="text-dark small fw-bold text-uppercase mb-2 d-block">Pending Payout</span>
                <h2 class="fw-bold text-dark mb-3">&#36;42,500</h2>
                <button onclick="window.top.location.href='../404.html'; return false;" class="btn btn-sm text-white fw-bold rounded-pill px-4" style="background: var(--primary-color);">Request Transfer</button>
            </div>
        </div>
        <div class="col-12 col-md-4">
            <div class="dash-card p-4 h-100">
                <span class="text-muted small fw-bold text-uppercase mb-2 d-block">YTD Earnings</span>
                <h2 class="fw-bold text-dark mb-3">&#36;385,200</h2>
                <p class="text-success small fw-bold mb-0"><i class="fas fa-arrow-up me-1"></i> +22% vs last year</p>
            </div>
        </div>
        <div class="col-12 col-md-4">
            <div class="dash-card p-4 h-100">
                <span class="text-muted small fw-bold text-uppercase mb-2 d-block">Avg Margin</span>
                <h2 class="fw-bold text-dark mb-3">24.5%</h2>
                <p class="text-muted small fw-bold mb-0">Per managed client</p>
            </div>
        </div>
    </div>

    <div class="col-12 fade-in">
        <div class="dash-card p-4">
            <h5 class="fw-bold text-dark mb-4">Monthly Revenue Share</h5>
            <div id="barChart" style="margin-top: -10px;"></div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const els = document.querySelectorAll('.fade-in');
            els.forEach((el, index) => { el.style.opacity = '0'; el.style.transform = 'translateY(15px)'; el.style.transition = 'all 0.5s ease ' + (index * 0.1) + 's'; setTimeout(() => { el.style.opacity = '1'; el.style.transform = 'translateY(0)'; }, 50); });

            var barOptions = {
                series: [{ name: 'Commission', data: [32, 35, 41, 38, 42, 48, 52] }],
                chart: { height: 350, type: 'bar', toolbar: { show: false }, fontFamily: 'Inter, sans-serif' },
                colors: ['#8b5cf6'],
                plotOptions: { bar: { borderRadius: 6, columnWidth: '45%' } },
                dataLabels: { enabled: false },
                xaxis: { categories: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul'], labels: { style: { colors: '#71717a' } }, axisBorder: { show: false }, axisTicks: { show: false } },
                yaxis: { labels: { style: { colors: '#71717a' }, formatter: (value) => { return "$" + value + "k" } } },
                grid: { borderColor: 'rgba(0,0,0,0.05)', strokeDashArray: 4 }
            };
            var barChart = new ApexCharts(document.querySelector("#barChart"), barOptions);
            barChart.render();
        });
    </script>
</body>
</html>
