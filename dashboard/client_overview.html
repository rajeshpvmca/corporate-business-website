<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Client Dashboard Overview</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        body {
            background-color: transparent;
            color: var(--text-dark);
            padding: 1.5rem;
            min-height: 100vh;
        }
        
        .dash-card {
            background: var(--white);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 16px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        
        .dash-card:hover {
            border-color: rgba(139, 92, 246, 0.5);
        }

        .header-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
            box-shadow: 0 5px 15px rgba(139, 92, 246, 0.3);
        }

        /* ApexCharts Theme Overrides */
        .apexcharts-tooltip {
            background: #fff !important;
            border: 1px solid rgba(0,0,0,0.1) !important;
            color: #333 !important;
        }
        .apexcharts-tooltip-title {
            background: #f8f9fa !important;
            border-bottom: 1px solid rgba(0,0,0,0.1) !important;
        }
    </style>
</head>
<body>
    <div class="d-flex align-items-center mb-4 fade-in">
        <div class="header-icon me-3">
            <span class="material-symbols-outlined">dashboard</span>
        </div>
        <div>
            <h3 class="fw-bold mb-0 text-dark" style="font-size: clamp(1.2rem, 4vw, 1.5rem);">Dashboard Overview</h3>
            <p class="text-muted small fw-bold text-uppercase letter-spacing-1 mb-0">Client Environment</p>
        </div>
    </div>

    <!-- Metrics Row -->
    <div class="row g-3 mb-4 fade-in">
        <div class="col-12 col-md-6 col-lg-3">
            <div class="dash-card p-4 h-100">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="text-muted small fw-bold text-uppercase">Total ARR</span>
                    <span class="material-symbols-outlined text-primary">payments</span>
                </div>
                <h3 class="fw-bold text-dark mb-1">$2.4M</h3>
                <p class="text-success small fw-bold mb-0"><i class="fas fa-arrow-up me-1"></i> 14.5% vs last year</p>
            </div>
        </div>
        <div class="col-12 col-md-6 col-lg-3">
            <div class="dash-card p-4 h-100">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="text-muted small fw-bold text-uppercase">Active Projects</span>
                    <span class="material-symbols-outlined text-info">account_tree</span>
                </div>
                <h3 class="fw-bold text-dark mb-1">12</h3>
                <p class="text-success small fw-bold mb-0"><i class="fas fa-arrow-up me-1"></i> 3 deployed this month</p>
            </div>
        </div>
        <div class="col-12 col-md-6 col-lg-3">
            <div class="dash-card p-4 h-100">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="text-muted small fw-bold text-uppercase">System Uptime</span>
                    <span class="material-symbols-outlined text-success">speed</span>
                </div>
                <h3 class="fw-bold text-dark mb-1">99.99%</h3>
                <p class="text-muted small fw-bold mb-0">Across all 5 regions</p>
            </div>
        </div>
        <div class="col-12 col-md-6 col-lg-3">
            <div class="dash-card p-4 h-100" style="background: linear-gradient(135deg, rgba(139,92,246,0.1), rgba(244,63,94,0.1));">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="text-dark small fw-bold text-uppercase">Open Tickets</span>
                    <span class="material-symbols-outlined text-dark">support_agent</span>
                </div>
                <h3 class="fw-bold text-dark mb-1">2</h3>
                <button onclick="window.top.location.href='../404.html'; return false;" class="btn btn-sm btn-outline-dark rounded-pill px-3 mt-2">View Tickets</button>
            </div>
        </div>
    </div>

    <!-- Charts Row -->
    <div class="row g-3 mb-4 fade-in">
        <div class="col-12 col-lg-8">
            <div class="dash-card p-4 h-100">
                <h5 class="fw-bold text-dark mb-4">Infrastructure Performance & Load</h5>
                <div id="areaChart"></div>
            </div>
        </div>
        <div class="col-12 col-lg-4">
            <div class="dash-card p-4 h-100">
                <h5 class="fw-bold text-dark mb-4">Resource Allocation</h5>
                <div id="donutChart" class="d-flex justify-content-center"></div>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Fade-in animation
            const els = document.querySelectorAll('.fade-in');
            els.forEach((el, index) => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(15px)';
                el.style.transition = 'all 0.5s ease ' + (index * 0.1) + 's';
                setTimeout(() => {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, 50);
            });

            // ApexCharts - Area Chart
            var areaOptions = {
                series: [{
                    name: 'API Requests',
                    data: [31, 40, 28, 51, 42, 109, 100]
                }, {
                    name: 'Database Load',
                    data: [11, 32, 45, 32, 34, 52, 41]
                }],
                chart: {
                    height: 300,
                    type: 'area',
                    toolbar: { show: false },
                    fontFamily: 'Inter, sans-serif'
                },
                colors: ['#8b5cf6', '#f43f5e'],
                fill: {
                    type: 'gradient',
                    gradient: {
                        shadeIntensity: 1,
                        opacityFrom: 0.4,
                        opacityTo: 0.05,
                        stops: [0, 90, 100]
                    }
                },
                dataLabels: { enabled: false },
                stroke: { curve: 'smooth', width: 2 },
                xaxis: {
                    categories: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                    labels: { style: { colors: '#71717a' } },
                    axisBorder: { show: false },
                    axisTicks: { show: false }
                },
                yaxis: {
                    labels: { style: { colors: '#71717a' } }
                },
                grid: {
                    borderColor: 'rgba(0,0,0,0.05)',
                    strokeDashArray: 4,
                },
                legend: { labels: { colors: '#333' } }
            };
            var areaChart = new ApexCharts(document.querySelector("#areaChart"), areaOptions);
            areaChart.render();

            // ApexCharts - Donut Chart
            var donutOptions = {
                series: [44, 55, 13, 33],
                chart: {
                    height: 320,
                    type: 'donut',
                    fontFamily: 'Inter, sans-serif'
                },
                labels: ['Compute', 'Storage', 'Network', 'Security'],
                colors: ['#8b5cf6', '#f43f5e', '#fbbf24', '#0ea5e9'],
                stroke: { show: false },
                dataLabels: { enabled: false },
                legend: {
                    position: 'bottom',
                    labels: { colors: '#333' }
                },
                plotOptions: {
                    pie: {
                        donut: {
                            size: '75%',
                            labels: {
                                show: true,
                                name: { color: '#71717a' },
                                value: { color: '#333', fontSize: '1.5rem', fontWeight: 'bold' },
                                total: {
                                    show: true,
                                    showAlways: true,
                                    color: '#71717a',
                                    label: 'Total Active'
                                }
                            }
                        }
                    }
                }
            };
            var donutChart = new ApexCharts(document.querySelector("#donutChart"), donutOptions);
            donutChart.render();
        });
    </script>
</body>
</html>
