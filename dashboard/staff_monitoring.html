<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>System Monitoring</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        body { background-color: transparent; color: var(--text-dark); padding: 1.5rem; min-height: 100vh; }
        .dash-card { background: var(--white); border: 1px solid rgba(0, 0, 0, 0.05); border-radius: 16px; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03); }
        .header-icon { width: 45px; height: 45px; background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: white; box-shadow: 0 5px 15px rgba(139, 92, 246, 0.3); }
        .apexcharts-tooltip { background: #fff !important; border: 1px solid rgba(0,0,0,0.1) !important; color: #333 !important; }
        .apexcharts-tooltip-title { background: #f8f9fa !important; border-bottom: 1px solid rgba(0,0,0,0.1) !important; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    </style>
</head>
<body>
    <div class="d-flex align-items-center mb-4 fade-in">
        <div class="header-icon me-3">
            <span class="material-symbols-outlined">speed</span>
        </div>
        <div>
            <h3 class="fw-bold mb-0 text-dark" style="font-size: clamp(1.2rem, 4vw, 1.5rem);">System Monitoring</h3>
            <p class="text-muted small fw-bold text-uppercase letter-spacing-1 mb-0">Live Telemetry</p>
        </div>
    </div>

    <div class="row g-4 fade-in mb-4">
        <div class="col-12 col-md-4">
            <div class="dash-card p-4">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="fw-bold text-dark mb-0">US-East Cluster</h6>
                    <span class="status-dot bg-success shadow-sm"></span>
                </div>
                <div class="d-flex justify-content-between text-muted small mb-1">
                    <span>CPU: 45%</span>
                    <span>RAM: 62%</span>
                </div>
                <div class="progress mt-2" style="height: 4px; background: rgba(0,0,0,0.05);">
                    <div class="progress-bar bg-success" style="width: 45%;"></div>
                </div>
            </div>
        </div>
        <div class="col-12 col-md-4">
            <div class="dash-card p-4">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="fw-bold text-dark mb-0">EU-Central Cluster</h6>
                    <span class="status-dot bg-warning shadow-sm"></span>
                </div>
                <div class="d-flex justify-content-between text-muted small mb-1">
                    <span>CPU: 88%</span>
                    <span>RAM: 91%</span>
                </div>
                <div class="progress mt-2" style="height: 4px; background: rgba(0,0,0,0.05);">
                    <div class="progress-bar bg-warning" style="width: 88%;"></div>
                </div>
            </div>
        </div>
        <div class="col-12 col-md-4">
            <div class="dash-card p-4">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="fw-bold text-dark mb-0">AP-South Cluster</h6>
                    <span class="status-dot bg-success shadow-sm"></span>
                </div>
                <div class="d-flex justify-content-between text-muted small mb-1">
                    <span>CPU: 32%</span>
                    <span>RAM: 41%</span>
                </div>
                <div class="progress mt-2" style="height: 4px; background: rgba(0,0,0,0.05);">
                    <div class="progress-bar bg-success" style="width: 32%;"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="col-12 fade-in">
        <div class="dash-card p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h5 class="fw-bold text-dark mb-0">Aggregated Resource Utilization</h5>
                <select class="form-select form-select-sm w-auto border-0 bg-light fw-bold text-muted">
                    <option>Last 1 Hour</option>
                    <option>Last 24 Hours</option>
                </select>
            </div>
            <div id="utilizationChart" style="margin-top: -10px;"></div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const els = document.querySelectorAll('.fade-in');
            els.forEach((el, index) => { el.style.opacity = '0'; el.style.transform = 'translateY(15px)'; el.style.transition = 'all 0.5s ease ' + (index * 0.1) + 's'; setTimeout(() => { el.style.opacity = '1'; el.style.transform = 'translateY(0)'; }, 50); });

            var utilOptions = {
                series: [{ name: 'Global CPU', data: [45, 52, 68, 74, 55, 62, 59] }, { name: 'Global Memory', data: [60, 62, 65, 66, 68, 70, 72] }],
                chart: { height: 350, type: 'line', toolbar: { show: false }, fontFamily: 'Inter, sans-serif' },
                colors: ['#8b5cf6', '#f43f5e'],
                stroke: { width: 3, curve: 'smooth' },
                xaxis: { categories: ['10:00', '10:10', '10:20', '10:30', '10:40', '10:50', '11:00'], labels: { style: { colors: '#71717a' } }, axisBorder: { show: false }, axisTicks: { show: false } },
                yaxis: { max: 100, labels: { style: { colors: '#71717a' }, formatter: (value) => { return value + "%" } } },
                grid: { borderColor: 'rgba(0,0,0,0.05)', strokeDashArray: 4 },
                legend: { position: 'top', labels: { colors: '#333' } }
            };
            var utilChart = new ApexCharts(document.querySelector("#utilizationChart"), utilOptions);
            utilChart.render();
        });
    </script>
</body>
</html>
