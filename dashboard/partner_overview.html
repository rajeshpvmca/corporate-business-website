<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Partner Portal Overview</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        body { background-color: transparent; color: var(--text-dark); padding: 1.5rem; min-height: 100vh; }
        .dash-card { background: var(--white); border: 1px solid rgba(0, 0, 0, 0.05); border-radius: 16px; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03); transition: transform 0.3s ease, border-color 0.3s ease; }
        .dash-card:hover { border-color: rgba(139, 92, 246, 0.5); }
        .header-icon { width: 45px; height: 45px; background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: white; box-shadow: 0 5px 15px rgba(139, 92, 246, 0.3); }
        .apexcharts-tooltip { background: #fff !important; border: 1px solid rgba(0,0,0,0.1) !important; color: #333 !important; }
        .apexcharts-tooltip-title { background: #f8f9fa !important; border-bottom: 1px solid rgba(0,0,0,0.1) !important; }
    </style>
</head>
<body>
    <div class="d-flex align-items-center mb-4 fade-in">
        <div class="header-icon me-3">
            <span class="material-symbols-outlined">analytics</span>
        </div>
        <div>
            <h3 class="fw-bold mb-0 text-dark" style="font-size: clamp(1.2rem, 4vw, 1.5rem);">Partner Portal Overview</h3>
            <p class="text-muted small fw-bold text-uppercase letter-spacing-1 mb-0">Partner Studio</p>
        </div>
    </div>

    <div class="row g-3 mb-4 fade-in">
        <div class="col-12 col-md-6 col-lg-3">
            <div class="dash-card p-4 h-100 text-center" style="background: linear-gradient(135deg, rgba(139,92,246,0.1), rgba(244,63,94,0.1)); border: none;">
                <span class="material-symbols-outlined text-primary fs-1 mb-2">workspace_premium</span>
                <p class="text-dark small fw-bold text-uppercase mb-1">Partner Tier</p>
                <h3 class="fw-bold text-dark mb-0">Platinum</h3>
            </div>
        </div>
        <div class="col-12 col-md-6 col-lg-3">
            <div class="dash-card p-4 h-100">
                <p class="text-muted small fw-bold text-uppercase mb-2">Total Managed Clients</p>
                <h3 class="fw-bold text-dark mb-1">45</h3>
                <p class="text-success small fw-bold mb-0"><i class="fas fa-arrow-up me-1"></i> +5 this quarter</p>
            </div>
        </div>
        <div class="col-12 col-md-6 col-lg-3">
            <div class="dash-card p-4 h-100">
                <p class="text-muted small fw-bold text-uppercase mb-2">Monthly Recurring Rev</p>
                <!-- Workaround for PowerShell variable interpolation in here -> 1.2M with literal $ sign -->
                <h3 class="fw-bold text-dark mb-1">&#36;1.2M</h3>
                <p class="text-success small fw-bold mb-0"><i class="fas fa-arrow-up me-1"></i> 12% Growth</p>
            </div>
        </div>
        <div class="col-12 col-md-6 col-lg-3">
            <div class="dash-card p-4 h-100">
                <p class="text-muted small fw-bold text-uppercase mb-2">Client Retention</p>
                <h3 class="fw-bold text-dark mb-1">98.5%</h3>
                <p class="text-primary small fw-bold mb-0">Industry Leading</p>
            </div>
        </div>
    </div>

    <div class="row g-4 fade-in">
        <div class="col-12 col-lg-8">
            <div class="dash-card p-4 h-100">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="fw-bold text-dark mb-0">Client Growth Trajectory</h5>
                    <select class="form-select form-select-sm w-auto border-0 bg-light fw-bold text-muted">
                        <option>This Year</option>
                        <option>Last Year</option>
                    </select>
                </div>
                <div id="growthChart"></div>
            </div>
        </div>
        <div class="col-12 col-lg-4">
            <div class="dash-card p-4 h-100">
                <h5 class="fw-bold text-dark mb-4">Quick Actions</h5>
                <div class="d-grid gap-3">
                    <button onclick="window.top.location.href='../404.html'; return false;" class="btn btn-outline-dark rounded-pill py-3 fw-bold d-flex align-items-center justify-content-center gap-2">
                        <span class="material-symbols-outlined fs-5">person_add</span> Onboard New Client
                    </button>
                    <button onclick="window.top.location.href='../404.html'; return false;" class="btn text-white rounded-pill py-3 fw-bold d-flex align-items-center justify-content-center gap-2" style="background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); border: none;">
                        <span class="material-symbols-outlined fs-5">payments</span> Request Commission Payout
                    </button>
                    <button onclick="window.top.location.href='../404.html'; return false;" class="btn btn-outline-dark rounded-pill py-3 fw-bold d-flex align-items-center justify-content-center gap-2">
                        <span class="material-symbols-outlined fs-5">support_agent</span> Priority Partner Support
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const els = document.querySelectorAll('.fade-in');
            els.forEach((el, index) => {
                el.style.opacity = '0'; el.style.transform = 'translateY(15px)';
                el.style.transition = 'all 0.5s ease ' + (index * 0.1) + 's';
                setTimeout(() => { el.style.opacity = '1'; el.style.transform = 'translateY(0)'; }, 50);
            });

            var growthOptions = {
                series: [{ name: 'Active Clients', data: [25, 28, 30, 34, 38, 42, 45] }],
                chart: { height: 320, type: 'area', toolbar: { show: false }, fontFamily: 'Inter, sans-serif' },
                colors: ['#8b5cf6'],
                fill: { type: 'gradient', gradient: { shadeIntensity: 1, opacityFrom: 0.4, opacityTo: 0.05, stops: [0, 90, 100] } },
                dataLabels: { enabled: false },
                stroke: { curve: 'smooth', width: 3 },
                xaxis: { categories: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul'], labels: { style: { colors: '#71717a' } }, axisBorder: { show: false }, axisTicks: { show: false } },
                yaxis: { labels: { style: { colors: '#71717a' } } },
                grid: { borderColor: 'rgba(0,0,0,0.05)', strokeDashArray: 4 },
                legend: { labels: { colors: '#333' } }
            };
            var growthChart = new ApexCharts(document.querySelector("#growthChart"), growthOptions);
            growthChart.render();
        });
    </script>
</body>
</html>
