<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Account Settings</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <style>
        body { background-color: transparent; color: var(--text-dark); padding: 1.5rem; min-height: 100vh; }
        .dash-card { background: var(--white); backdrop-filter: blur(15px); border: 1px solid rgba(0, 0, 0, 0.05); box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03); border-radius: 16px; }
        .header-icon { width: 45px; height: 45px; background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: var(--text-dark); box-shadow: 0 5px 15px rgba(139, 92, 246, 0.3); }
        .form-control-custom { background: rgba(0,0,0,0.02); border: 1px solid rgba(0,0,0,0.1); color: var(--text-dark); border-radius: 8px; padding: 0.75rem 1rem; }
        .form-control-custom:focus { background: rgba(0,0,0,0.05); border-color: var(--primary-color); color: var(--text-dark); box-shadow: none; }
        .form-switch .form-check-input { background-color: rgba(0,0,0,0.1); border-color: transparent; }
        .form-switch .form-check-input:checked { background-color: var(--primary-color); border-color: var(--primary-color); }
    </style>
</head>
<body>
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 fade-in gap-3">
        <div class="d-flex align-items-center">
            <div class="header-icon me-3">
                <span class="material-symbols-outlined">settings</span>
            </div>
            <div>
                <h3 class="fw-bold mb-0 text-dark" style="font-size: clamp(1.2rem, 4vw, 1.5rem);">Account Settings</h3>
                <p class="text-muted small fw-bold text-uppercase letter-spacing-1 mb-0">Preferences</p>
            </div>
        </div>
        <button onclick="window.top.location.href='../404.html'; return false;" class="btn btn-outline-dark rounded-pill px-4 fw-bold shadow-sm">Save Changes</button>
    </div>

    <div class="row g-4 fade-in">
        <div class="col-12 col-lg-8">
            <div class="dash-card p-4 p-md-5">
                <h5 class="fw-bold text-dark mb-4">Profile Information</h5>
                <div class="row g-4">
                    <div class="col-12 col-md-6">
                        <label class="form-label small fw-bold text-muted text-uppercase">Full Name</label>
                        <input type="text" class="form-control form-control-custom" value="Rajesh P V">
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label small fw-bold text-muted text-uppercase">Corporate Email</label>
                        <input type="email" class="form-control form-control-custom" value="rajeshpvmca@gmail.com" readonly>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label small fw-bold text-muted text-uppercase">Company Name</label>
                        <input type="text" class="form-control form-control-custom" value="Acme Corp">
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label small fw-bold text-muted text-uppercase">Timezone</label>
                        <select class="form-select form-control-custom">
                            <option value="est" selected>Eastern Time (ET)</option>
                            <option value="pst">Pacific Time (PT)</option>
                            <option value="utc">Coordinated Universal Time (UTC)</option>
                        </select>
                    </div>
                </div>
                
                <hr class="my-5" style="border-color: rgba(0,0,0,0.1);">
                
                <h5 class="fw-bold text-dark mb-4">Security</h5>
                <div class="d-flex justify-content-between align-items-center mb-3 p-3 rounded-3" style="background: rgba(0,0,0,0.02); border: 1px solid rgba(0,0,0,0.05);">
                    <div>
                        <h6 class="fw-bold text-dark mb-1">Two-Factor Authentication (2FA)</h6>
                        <p class="text-muted small mb-0">Protect your account with an extra layer of security.</p>
                    </div>
                    <div class="form-check form-switch fs-4">
                        <input class="form-check-input shadow-none m-0" type="checkbox" checked>
                    </div>
                </div>
                <button onclick="window.top.location.href='../404.html'; return false;" class="btn btn-outline-dark rounded-pill px-4 py-2 fw-bold mt-3">Change Password</button>
            </div>
        </div>
        
        <div class="col-12 col-lg-4">
            <div class="dash-card p-4 p-md-5">
                <h5 class="fw-bold text-dark mb-4">Notifications</h5>
                
                <div class="form-check form-switch d-flex justify-content-between align-items-center ps-0 mb-4">
                    <label class="form-check-label text-dark" style="cursor: pointer;">Deployment Alerts</label>
                    <input class="form-check-input shadow-none m-0 fs-5" type="checkbox" checked>
                </div>
                
                <div class="form-check form-switch d-flex justify-content-between align-items-center ps-0 mb-4">
                    <label class="form-check-label text-dark" style="cursor: pointer;">Billing Reminders</label>
                    <input class="form-check-input shadow-none m-0 fs-5" type="checkbox" checked>
                </div>
                
                <div class="form-check form-switch d-flex justify-content-between align-items-center ps-0 mb-4">
                    <label class="form-check-label text-dark" style="cursor: pointer;">Marketing Updates</label>
                    <input class="form-check-input shadow-none m-0 fs-5" type="checkbox">
                </div>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const els = document.querySelectorAll('.fade-in');
            els.forEach((el, index) => {
                el.style.opacity = '0'; el.style.transform = 'translateY(15px)';
                el.style.transition = 'all 0.5s ease ' + (index * 0.1) + 's';
                setTimeout(() => { el.style.opacity = '1'; el.style.transform = 'translateY(0)'; }, 50);
            });
        });
    </script>
</body>
</html>
