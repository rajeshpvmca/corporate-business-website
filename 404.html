<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>404 - Page Not Found | Stackly Corporate</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--dark-bg);
            color: #ffffff;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background Orbs */
        .orb-1, .orb-2 {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            z-index: -1;
            animation: float 10s infinite ease-in-out alternate;
        }
        .orb-1 {
            width: 400px;
            height: 400px;
            background: var(--primary-color);
            top: -100px;
            left: -100px;
        }
        .orb-2 {
            width: 300px;
            height: 300px;
            background: var(--secondary-color);
            bottom: -50px;
            right: -100px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.2); }
        }

        /* Glassmorphism Container */
        .error-card {
            background: rgba(9, 9, 11, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            padding: 3rem 2rem;
            text-align: center;
            position: relative;
            z-index: 10;
            max-width: 600px;
            width: 90%;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Massive Gradient 404 Text */
        .error-code {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(6rem, 15vw, 10rem);
            font-weight: 900;
            line-height: 1;
            margin-bottom: 0;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: shine 4s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .error-title {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 700;
            margin-bottom: 1rem;
            color: #ffffff;
        }

        .error-desc {
            color: rgba(255, 255, 255, 0.7);
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        /* Buttons */
        .btn-custom-solid {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            transition: all 0.3s ease;
        }
        .btn-custom-solid:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4);
            color: white;
        }

        .btn-custom-outline {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            transition: all 0.3s ease;
        }
        .btn-custom-outline:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: white;
            color: white;
            transform: translateY(-3px);
        }
        
        /* 320px Responsiveness adjustments */
        @media (max-width: 380px) {
            .error-card {
                padding: 2.5rem 1.5rem;
            }
        }
    </style>
</head>

<body>
    <!-- Background Elements -->
    <div class="position-fixed top-0 start-0 w-100 h-100 pointer-none" style="background: url('assets/images/img_01.webp') no-repeat center center; background-size: cover; z-index: -3; opacity: 0.15;"></div>
    <div class="orb-1"></div>
    <div class="orb-2"></div>

    <div class="container d-flex justify-content-center align-items-center">
        <div class="error-card">
            
            <div class="mb-4">
                <!-- Stackly Logo as a mask -->
                <div aria-label="Stackly Logo" class="mx-auto"
                    style="-webkit-mask: url('assets/images/logoStackly.webp') no-repeat center center; -webkit-mask-size: contain; mask: url('assets/images/logoStackly.webp') no-repeat center center; mask-size: contain; background: white; width: 140px; height: 40px; opacity: 0.8;">
                </div>
            </div>

            <h1 class="error-code">404</h1>
            <h2 class="error-title">Page Not Found</h2>
            <p class="error-desc">We couldn't find the page you were looking for. It might have been moved, renamed, or temporarily unavailable.</p>
            
            <div class="d-flex flex-column flex-sm-row justify-content-center gap-3">
                <button onclick="history.back()" class="btn btn-custom-outline rounded-pill px-4 py-3 fw-bold d-flex align-items-center justify-content-center gap-2">
                    <span class="material-symbols-outlined fs-5">arrow_back</span> Go Back
                </button>
                <a href="index.html" class="btn btn-custom-solid rounded-pill px-4 py-3 fw-bold d-flex align-items-center justify-content-center gap-2 text-decoration-none">
                    <span class="material-symbols-outlined fs-5">home</span> Back to Home
                </a>
            </div>
            
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
